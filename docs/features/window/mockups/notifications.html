<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>bars — дизайн уведомлений</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="refinement.css"><script src="theme.js"></script>
<style>
.notice-panel{position:absolute;left:14px;bottom:69px;width:min(440px,calc(100% - 28px));max-height:calc(100% - 88px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 48px #0003;z-index:40}
.notice-head{padding:16px;border-bottom:1px solid var(--line)}.notice-head .link{font-size:12px}.notice-list{overflow:auto;min-height:0}.notice-panel footer{padding:10px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
.notice{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}.notice:last-child{border:0}.notice-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-text)}.notice-icon.ok{background:var(--good-soft);color:var(--good)}.notice-icon.error{background:var(--bad-soft);color:var(--bad)}.notice-icon.warn{background:var(--mid-soft);color:var(--mid)}
.notice h3{font-size:13px}.notice .project-name{overflow-wrap:anywhere;line-height:1.4;margin:2px 0 7px;font-weight:600}.notice p{font-size:12px;margin:5px 0 8px}.notice time{color:var(--muted);font-size:11px}.notice .link{font-size:12px}.notice-actions{display:flex;align-items:center;gap:14px;margin-top:9px;flex-wrap:wrap}progress{width:100%;height:6px;accent-color:var(--accent);display:block;margin-top:10px}.notice-panel .banner{margin:10px 12px 0}.notice-panel .banner button{font-size:12px}.notice-panel .banner p{margin:0 0 5px}
.notice-panel:focus{outline:none}.notice{padding:12px 16px;gap:8px}.notice-tail{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.notice-actions{margin-top:0;gap:10px}.notice .project-name{margin:1px 0 4px}.notice p{margin:4px 0 5px}.notice .unread{font-size:10px;padding:0;background:none;color:var(--accent-text)}
</style></head><body><script src="refinement.js"></script><script src="notifications.js"></script></body></html>
