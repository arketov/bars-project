<!doctype html>
<html lang="ru" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bars — рабочая область и редактор · макет</title>
<link rel="stylesheet" href="theme.css">

<style>
  /* ---------- проект ---------- */
  .projwrap { position: relative; margin: 0 14px 10px; }
  .proj { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); transition: border-color .15s; }
  .proj:hover { border-color: var(--line-2); }
  .proj .pn { flex: 1; min-width: 0; }
  .proj .pn b { display: block; font-size: 13.5px; font-weight: 600; }
  .proj .pn small { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj svg { color: var(--faint); flex: none; }
  .projmenu { display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.16); padding: 6px; }
  .projwrap.open .projmenu { display: block; }
  .pitem { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  .pitem:hover { background: var(--panel-2); }
  .pitem.on { background: var(--accent-soft); }
  .pitem .pn { flex: 1; min-width: 0; }
  .pitem .pn b { display: block; font-size: 13px; font-weight: 600; }
  .pitem .pn small { display: block; color: var(--muted); font-size: 11.5px; }
  .pitem.on .pn b { color: var(--accent-text); }
  .pmenu-sep { height: 1px; background: var(--line); margin: 6px 4px; }
  .padd { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 7px 8px; border-radius: 8px; color: var(--accent-text); font-weight: 600; font-size: 13px; }
  .padd:hover { background: var(--panel-2); }

  /* ---------- дерево ---------- */
  .filter { margin: 0 14px 8px; position: relative; display: block; }
  .filter input { width: 100%; padding: 8px 10px 8px 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel-2); outline: none; }
  .filter input:focus { border-color: var(--accent); background: var(--panel); }
  .filter svg { position: absolute; left: 10px; top: 10px; color: var(--faint); }
  .tree { flex: 1; overflow-y: auto; padding: 2px 8px 10px; min-height: 0; }
  .node > .row { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; user-select: none; }
  .node > .row:hover { background: var(--panel-2); }
  .caret { width: 18px; height: 18px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); transition: transform .15s; padding: 0; flex: none; }
  .node.open > .row .caret { transform: rotate(90deg); }
  .row label { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; }
  .row .nm { flex: 1; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.mod > .row .nm { font-weight: 600; }
  .node.dir > .row .nm { color: var(--muted); font-weight: 600; }
  .row .ct { color: var(--faint); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .kids { display: none; margin-left: 15px; padding-left: 6px; border-left: 1px solid var(--line); }
  .node.open > .kids { display: block; }
  .spacer { width: 18px; flex: none; }

  .status { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .iconbtn { border: 1px solid transparent; background: none; color: var(--muted); padding: 5px; border-radius: 8px; display: grid; place-items: center; }
  .iconbtn:hover { background: var(--panel-2); border-color: var(--line); color: var(--text); }

  /* ---------- поиск ---------- */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top { padding: 22px 32px 14px; }
  .ask { max-width: 920px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 12px 10px 16px; transition: border-color .15s, box-shadow .15s; }
  .ask:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
  .ask textarea { width: 100%; border: 0; outline: none; background: transparent; resize: none; font-size: 16px; line-height: 1.5; min-height: 26px; display: block; }
  .ask textarea::placeholder { color: var(--faint); }
  .askbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 6px; }
  .app.viewing .kbdhint, .app.viewing .sep { display: none; }
  .scope { flex: 1 1 180px; color: var(--muted); font-size: 12.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scope b { color: var(--text); font-weight: 600; }
  .go { padding: 9px 18px; border-radius: 10px; }
  .results { flex: 1; overflow-y: auto; padding: 4px 32px 80px; min-height: 0; }
  .wrap { max-width: 920px; margin: 0 auto; }
  .meta { color: var(--muted); font-size: 12.5px; margin: 6px 2px 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .meta b { color: var(--text); font-weight: 600; }

  /* ---------- карточка результата ---------- */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; box-shadow: var(--shadow); overflow: hidden; animation: rise .35s both; transition: border-color .15s; }
  .card:hover { border-color: var(--line-2); }
  .card:nth-child(2) { animation-delay: .06s; } .card:nth-child(3) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .chead { display: grid; grid-template-columns: 30px 1fr auto 22px; gap: 14px; align-items: center; padding: 14px 16px; cursor: pointer; }
  .rank { width: 30px; height: 30px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; color: var(--muted); font-size: 13px; }
  .card:first-child .rank { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
  .ctitle { font-weight: 600; font-size: 15px; line-height: 1.3; }
  .crumbs { color: var(--muted); font-size: 12.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs .mono { color: var(--accent-text); font-size: 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .snippet { color: var(--muted); margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13.5px; }
  .card.open .snippet { display: none; }
  .fit { text-align: right; min-width: 118px; }
  .pct { font-size: 24px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .pct small { font-size: 13px; font-weight: 600; margin-left: 1px; }
  .flabel { font-size: 11.5px; font-weight: 600; margin-top: 4px; }
  .bar { height: 5px; background: var(--low-soft); border-radius: 5px; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } }
  .f-good .pct, .f-good .flabel { color: var(--good); } .f-good .bar i { background: var(--good); }
  .f-mid .pct, .f-mid .flabel { color: var(--mid); } .f-mid .bar i { background: var(--mid); }
  .f-low .pct, .f-low .flabel { color: var(--low); } .f-low .bar i { background: var(--low); }
  .chev { color: var(--faint); transition: transform .2s; display: grid; place-items: center; }
  .card.open .chev { transform: rotate(180deg); }
  .cbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .card.open .cbody { grid-template-rows: 1fr; }
  .cbody > div { overflow: hidden; }
  .cin { padding: 4px 20px 18px 60px; }
  .text { font-size: 14.5px; line-height: 1.65; }
  .text p { margin: 0 0 .75em; } .text ul { margin: 0 0 .75em; padding-left: 1.3em; } .text li { margin: .2em 0; }
  .text code { font: 12.5px var(--mono); background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  .cfoot { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .nums { color: var(--faint); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .card.shown { border-color: var(--accent); }

  /* ---------- число результатов ---------- */
  .count { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 8px; background: var(--panel-2); }
  .stepper button { border: 0; background: none; width: 24px; height: 26px; color: var(--muted); font-size: 15px; line-height: 1; padding: 0; }
  .stepper button:hover { color: var(--accent-text); }
  .stepper b { min-width: 18px; text-align: center; color: var(--text); font-variant-numeric: tabular-nums; }
  .count .reset { color: var(--faint); font-size: 11.5px; }
  .sep { width: 1px; height: 20px; background: var(--line); }

  /* ---------- просмотр документа ---------- */
  .app.viewing { grid-template-columns: 300px minmax(420px, 1fr) minmax(440px, 1.1fr); }
  .viewer { display: none; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); animation: slide .25s both; }
  .app.viewing .viewer { display: flex; }
  @keyframes slide { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  .vhead { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px 22px; border-bottom: 1px solid var(--line); }
  .vhead .vt { flex: 1; min-width: 0; }
  .vhead .vt b { display: block; font-size: 15px; }
  .vhead .vt small { display: block; color: var(--muted); font: 11.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbody { flex: 1; overflow-y: auto; padding: 18px 28px 80px; min-height: 0; }
  .md { font-size: 14.5px; line-height: 1.7; max-width: 720px; }
  .md h1 { font-size: 22px; margin: 0 0 12px; } .md h2 { font-size: 17px; margin: 22px 0 8px; }
  .md p { margin: 0 0 .8em; } .md ul, .md ol { margin: 0 0 .8em; padding-left: 1.3em; } .md li { margin: .2em 0; }
  .md code { font: 12.5px var(--mono); background: var(--panel-2); border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  .md section { position: relative; padding: 2px 0; border-radius: 10px; transition: background .2s; }
  .md section.hit { background: var(--accent-soft); box-shadow: -14px 0 0 var(--accent-soft), 14px 0 0 var(--accent-soft); padding: 4px 0 6px; }
  .md section.hit::before { content: ""; position: absolute; left: -14px; top: 0; bottom: 0; width: 3px; border-radius: 3px; background: var(--accent); }
  .md section.hit h2 { margin-top: 8px; }
  .hitlabel { display: inline-block; font: 600 11px var(--mono); color: var(--accent-text); margin-bottom: 2px; }
</style>
<link rel="stylesheet" href="workspace.css">
</head>
<body>
<div class="app" id="workspace">
 <div class="layout-slot" data-slot="left"><aside id="navigation-pane">
  <div class="brand"><div class="logo">b</div><div><b>bars</b><small>поиск по документации проектов</small></div><button class="iconbtn nav-menu" aria-label="Меню навигационной панели">···</button></div>
  <div class="projwrap"><button class="proj" id="project-button"><span class="dot ok"></span><span class="pn"><b>bars-project</b><small>bars-project/docs</small></span><span>⌄</span></button></div>
  <label class="filter"><input id="filter" aria-label="Фильтр документов" placeholder="Фильтр документов" autocomplete="off"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg></label>
  <div class="tree" id="tree"></div>
  <div class="graph-split" role="separator" tabindex="0" aria-label="Высота дерева и графа" aria-orientation="horizontal" aria-valuemin="100" aria-valuemax="350" aria-valuenow="180"></div>
  <section class="graph-pane" id="graph-pane"><div class="graph-head"><span draggable="true">Граф</span><button class="iconbtn" data-action="graph" aria-label="Граф в центре">⤢</button><button class="iconbtn" data-action="toggle-graph" aria-label="Свернуть граф">−</button></div><div id="small-graph"></div></section>
  <div class="sfoot selection-info" id="selection-footer"><span id="selection-summary"></span><button class="link" data-action="clear-scope">Сбросить</button></div>
  <div class="sfoot"><button class="index-status" data-action="indexing"><span class="dot ok"></span><span>Индекс актуален<small>обновлён 14:02</small></span></button><div class="side-tools"><button class="iconbtn" data-action="theme" aria-label="Светлая / тёмная тема"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button><button class="iconbtn" data-action="settings" aria-label="Настройки"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 5 3 2 1 4 5 3 2-3 4-1 3-5-3-2-1-4-5-3z"/></svg></button></div></div>
 </aside></div>
 <div class="layout-handle left" role="separator" tabindex="0" aria-label="Ширина левой зоны" aria-orientation="vertical" aria-valuemin="210" aria-valuemax="420" aria-valuenow="300"></div>
 <div class="layout-slot" data-slot="center"><main id="work-pane">
  <nav class="layout-nav" aria-label="Рабочие вкладки"><div id="tabs" role="tablist" aria-label="Открытые документы и экраны"></div><button class="iconbtn global-search" data-action="global-search" aria-label="Открыть поиск" title="Поиск"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button><button class="iconbtn" id="work-menu" aria-label="Меню рабочей панели">···</button></nav>
  <div id="work-content"></div>
 </main></div>
 <div class="layout-handle right" role="separator" tabindex="0" aria-label="Ширина правой зоны" aria-orientation="vertical" aria-valuemin="260" aria-valuemax="650" aria-valuenow="330"></div>
 <div class="layout-slot right-slot" data-slot="right"><section class="aux-pane" id="aux-pane"><div class="vhead"><div class="vt"><b id="aux-title">Ссылки документа</b><small id="aux-path"></small></div><button class="iconbtn" id="aux-menu" aria-label="Меню дополнительной панели">···</button><button class="iconbtn" data-action="close-right" aria-label="Закрыть дополнительную зону">×</button></div><div id="aux-content"></div><div class="right-split" hidden role="separator" tabindex="0" aria-label="Высота двух правых панелей" aria-orientation="horizontal" aria-valuemin="20" aria-valuemax="75" aria-valuenow="42"></div><section id="right-bottom" hidden><div class="graph-head"><span>Ссылки документа</span></div><div id="related-links" class="aux-links"></div></section></section></div>
</div>
<div id="menu" class="layout-popup" role="menu" hidden></div>
<dialog id="picker"><div class="vhead"><div class="vt"><b id="picker-title">Открыть документ</b><small id="picker-hint"></small></div><button class="iconbtn" data-action="close-picker" aria-label="Закрыть выбор документа">×</button></div><label class="filter"><input id="picker-query" aria-label="Найти документ" placeholder="Имя или путь"></label><div id="picker-list"></div></dialog>
<dialog id="state-dialog"><div class="vhead"><div class="vt"><b id="state-title"></b></div><button class="iconbtn" data-action="close-state" aria-label="Закрыть диалог">×</button></div><div id="state-body"></div></dialog>
<div class="layout-note">Макет 1.1.3 · демонстрационные документы · черновики только в памяти</div>
<div id="notice" role="status" aria-live="polite" hidden></div>
<script src="workspace-marked.js"></script>
<script src="workspace-markdown.js"></script>
<script src="workspace.js"></script>
</body></html>
