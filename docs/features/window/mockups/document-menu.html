<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bars — меню папок и документов</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="refinement.css"><script src="theme.js"></script>
<style>
.tree-item.context-target{background:var(--accent-soft);box-shadow:inset 2px 0 var(--accent)}.tree-item.context-target>button{color:var(--accent-text)}.tree-item svg{width:16px;height:16px}.tree-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-filter{width:100%;margin-bottom:12px}.menu{position:absolute;width:min(300px,calc(100% - 16px));max-height:calc(100% - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 40px #0003;padding:5px;z-index:60}.menu-heading{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:5px}.menu-heading b{display:block;font-size:12px}.menu-heading p{font:11px/1.5 var(--mono);overflow-wrap:anywhere;color:var(--muted);margin:4px 0 0}.menu button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:9px 10px;font-size:13px}.menu button:not(:disabled):hover,.menu button:not(:disabled):focus{background:var(--accent-soft);color:var(--accent-text)}.menu .explain{font-size:11px;line-height:1.5;color:var(--muted);margin:2px 10px 8px}.submenu{width:230px;z-index:61}.shortcut{color:var(--muted);font-size:11px}.path-block{font:12px/1.7 var(--mono);overflow-wrap:anywhere;background:var(--panel-2);border-radius:8px;padding:12px}.viewer-head{padding:16px 20px;border-bottom:1px solid var(--line)}.viewer-body{padding:24px}.viewer-body h2{font-size:20px}.viewer-body h3{margin-top:22px}.viewer-body p{color:var(--muted)}.tree-count{margin:14px 8px;color:var(--muted);font-size:12px}
