<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>bars — Удаление проекта</title>
<link rel="stylesheet" href="theme.css"><script src="theme.js" defer></script>
<style>body{margin:0;background:var(--bg,#f6f4f6);color:var(--text,#30282e);font:14px system-ui}aside{width:260px;padding:25px;height:100vh;box-sizing:border-box;background:var(--panel,white)}button{padding:10px 16px;border:1px solid #aaa;border-radius:8px;background:var(--panel,white);color:inherit;cursor:pointer}.danger{color:#c73550}.shade{position:fixed;inset:0;display:grid;place-items:center;background:#0006}dialog{position:static;margin:auto;border:1px solid #8884;border-radius:16px;padding:28px;max-width:480px;background:var(--panel,white);color:inherit;box-shadow:0 24px 80px #0005}h2{margin:0 0 12px}code{overflow-wrap:anywhere}footer{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.submit{background:#b32846;color:white;border:0}p{line-height:1.6}</style>
