<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>bars — анализ вызовов MCP</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="refinement.css"><script src="theme.js"></script>
<style>
.stats-header{margin-bottom:20px}.stats-header p{font-size:12px;color:var(--muted)}.summary{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0}.summary>div{padding:14px 18px;border-right:1px solid var(--line)}.summary>div:last-child{border:0}.summary b{display:block;font-size:25px;font-variant-numeric:tabular-nums}.summary small{color:var(--muted);font-size:12px}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:12px}.filter-extra{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0 18px}.filter-extra input{width:220px}.call-layout{display:grid;grid-template-columns:minmax(340px,1fr);gap:16px;align-items:start}.call-layout.has-detail{grid-template-columns:minmax(340px,1.05fr) minmax(340px,1fr)}.call-list{overflow:hidden}.list-head{padding:13px 16px;border-bottom:1px solid var(--line)}.call-row{display:grid;width:100%;grid-template-columns:62px minmax(0,1fr) 90px;align-items:start;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);padding:12px 14px;text-align:left}.call-row:hover{background:var(--panel-2)}.call-row.selected{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}.call-row time{font-size:11px;color:var(--muted);padding-top:2px}.call-row .tool{font:12px var(--mono);font-weight:600;display:block;overflow-wrap:anywhere}.call-row small{display:block;color:var(--muted);font-size:11px;margin:3px 0;overflow-wrap:anywhere}.call-row .metrics{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}.call-row .status-label{font-size:11px}.list-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;font-size:12px}.list-footer button{padding:5px 10px}
.call-detail{position:sticky;top:12px;overflow:hidden;min-width:0}.detail-header{padding:16px;border-bottom:1px solid var(--line)}.detail-header h2{overflow-wrap:anywhere;font:600 13px var(--mono)}.detail-content{padding:16px}.detail-content h3{margin:18px 0 9px}.detail-content h3:first-child{margin-top:0}.detail-meta{display:grid;grid-template-columns:88px minmax(0,1fr);gap:6px;font-size:12px}.detail-meta dd{margin:0;overflow-wrap:anywhere}.detail-meta dt{color:var(--muted)}.result-box{padding:12px;background:var(--panel-2);border-radius:8px;overflow-wrap:anywhere}.result-box p{font-size:12px;margin-bottom:0}.params{border-collapse:collapse;width:100%;font-size:11px;table-layout:fixed}.params th{text-align:left;color:var(--muted);font-weight:400;border-bottom:1px solid var(--line);padding:7px 4px}.params td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}.params th:first-child{width:25%}.params .reason{display:block;color:var(--muted);margin-top:4px}.detail-content details{font-size:12px;margin-top:16px}.detail-content summary{cursor:pointer;color:var(--accent-text)}pre{padding:12px;background:var(--panel-2);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 var(--mono)}.coverage{color:var(--muted);font-size:11px;margin:18px 0 0}.loading-lines{padding:24px}.loading-lines div{height:16px;border-radius:6px;background:var(--line);margin:14px 0;width:75%}.back-list{display:none}
@container(max-width:1150px){.call-layout.has-detail{grid-template-columns:minmax(0,1fr)}.has-detail .call-list{display:none}.call-detail{position:static}.back-list{display:inline-flex}.filters{grid-template-columns:repeat(3,minmax(0,1fr))}}@container(max-width:880px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.call-layout{grid-template-columns:minmax(0,1fr)}.summary>div{padding:12px}.summary b{font-size:22px}.call-row{grid-template-columns:48px minmax(0,1fr) 76px;padding:12px 10px;gap:6px}.call-row .metrics{font-size:11px}}
.history-policy{font-size:12px;color:var(--muted);margin:14px 0}.history-policy summary{cursor:pointer;color:var(--accent-text)}.history-policy label{display:flex;gap:8px;align-items:center;color:var(--text)}.history-policy p{max-width:720px}.summary small{display:block;overflow-wrap:anywhere}
</style></head><body><script src="refinement.js"></script><script src="mcp-statistics.js"></script></body></html>
