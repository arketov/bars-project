[package]
name = "spike-gguf"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "spike-gguf"
path = "src/main.rs"

[[bin]]
name = "spike-gguf-vulkan"
path = "src/main.rs"
required-features = ["vulkan"]

[features]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
bars-core = { path = "../../crates/bars-core" }
llama-cpp-2 = { version = "=0.1.160", default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
blake3 = "1.8"
