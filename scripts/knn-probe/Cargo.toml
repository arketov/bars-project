# Спайк замера полного kNN близости чанков (docs/knowledge/chunk-similarity.md).
# Отдельный крейт вне workspace: release-сборка не тянет llama.cpp и Tauri.
[package]
name = "knn-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
blake3 = "1.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
debug = false
