[package]
name = "bars-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bars"
path = "src/main.rs"

[dependencies]
log.workspace = true
anyhow.workspace = true
bars-protocol.workspace = true
bars-worker.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
blake3.workspace = true
toml.workspace = true
trash.workspace = true
bars-core.workspace = true

[target.'cfg(windows)'.dependencies]
# Те же версии, что у Tauri/Wry; дополнительных runtime-библиотек нет.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
bars-worker = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
