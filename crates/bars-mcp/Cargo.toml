[package]
name = "bars-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "bars_mcp"
path = "src/lib.rs"

[[bin]]
name = "bars-mcp"
path = "src/main.rs"

# НФТ-3: прокси не тянет bars-core и bars-worker — ни индекс, ни модели ему не нужны.
# Тест `proxy_has_no_heavy_dependencies` следит, чтобы они не попали в [dependencies].
[dependencies]
bars-graph = { workspace = true, features = ["schema"] }
anyhow.workspace = true
bars-protocol.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
toml.workspace = true

[dev-dependencies]
bars-worker = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "process"] }
