[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
bars-core = { path = "crates/bars-core" }
bars-protocol = { path = "crates/bars-protocol" }
bars-worker = { path = "crates/bars-worker" }

anyhow = "1.0"
blake3 = "1.8"
candle-core = "0.11"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
fastembed = { version = "=7.1.1", features = ["qwen3", "nomic-v2-moe"] }
ort = { version = "=2.0.0-rc.13", default-features = false }
notify = "8.2"
notify-debouncer-full = "0.7"
keyring-core = "1.0"
windows-native-keyring-store = "1.1"
apple-native-keyring-store = { version = "1.0", features = ["keychain"] }
interprocess = { version = "2.4", features = ["tokio"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml_edit = "0.25"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3.20"
ureq = { version = "3.4", features = ["json"] }
thiserror = "2.0"
toml = "1.1"
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "time", "net", "sync"] }
