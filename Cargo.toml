[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.dependencies]
bars-core = { path = "crates/bars-core" }
bars-protocol = { path = "crates/bars-protocol" }

anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
fastembed = { version = "=7.1.1", features = ["qwen3", "nomic-v2-moe"] }
ort = { version = "=2.0.0-rc.13", default-features = false }
interprocess = { version = "2.4", features = ["tokio"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"
widestring = "1.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-util", "time", "net", "sync"] }
